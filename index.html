<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#DED9C8">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Feldbuch">
<meta name="mobile-web-app-capable" content="yes">
<title>Feldbuch — Artenverzeichnis</title>
<style>
:root{
  --paper:#DED9C8; --paper2:#F1EDE2; --paper3:#FAF7EE;
  --ink:#1B2E24; --ink-soft:#63736A; --line:#C6BEAB;
  --stamp:#2E6E5B; --stamp-red:#9A4A2C; --stamp-teal:#2A5C6E; --stamp-blue:#4A5C2E;
  --gold:#94762A;
  --display: Copperplate, "Copperplate Gothic Light", "Palatino Linotype", Palatino, "Book Antiqua", serif;
  --body: "Avenir Next", "Segoe UI", Roboto, system-ui, -apple-system, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Courier New", monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--body);color:var(--ink);background-color:var(--paper);
  background-image:
    repeating-radial-gradient(circle at 16% 10%, transparent 0 17px, rgba(46,110,91,.07) 17px 18px, transparent 18px 35px),
    repeating-radial-gradient(circle at 86% 64%, transparent 0 21px, rgba(74,92,46,.05) 21px 22px, transparent 22px 43px),
    repeating-linear-gradient(76deg, rgba(27,46,36,.045) 0 .5px, transparent .5px 7px);
  background-attachment:fixed;-webkit-text-size-adjust:100%;padding:12px 12px 60px;line-height:1.45}
.wrap{max-width:940px;margin:0 auto}
button{font-family:inherit;color:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:15px;color:var(--ink)}

.pass{background:var(--paper2);border:1px solid var(--line);border-radius:3px;
  box-shadow:0 1px 0 rgba(255,255,255,.8) inset,0 6px 18px -12px rgba(27,46,36,.6);overflow:hidden;position:relative}
.pass-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:12px 14px 6px}
.pass-title{font-family:var(--display);letter-spacing:.19em;font-size:14px;text-transform:uppercase}
.pass-sub{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:var(--ink-soft);text-transform:uppercase;margin-top:3px}
.crest{font-size:22px;opacity:.8}
.pass-grid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:9px;padding:2px 14px 12px;align-items:end}
.fld .lb{font-family:var(--mono);font-size:8.5px;letter-spacing:.13em;color:var(--ink-soft);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fld .vl{font-family:var(--display);font-size:19px;letter-spacing:.04em;line-height:1.15}
.fld .vl small{font-size:11px;color:var(--ink-soft)}
#nameIn{width:100%;background:transparent;border:0;border-bottom:1px dashed var(--line);
  font-family:var(--display);font-size:15px;letter-spacing:.1em;text-transform:uppercase;padding:1px 0}
#nameIn:focus{outline:none;border-bottom-color:var(--stamp)}
.xpbar{height:4px;background:rgba(27,46,36,.1)}
.xpbar i{display:block;height:100%;background:var(--stamp);transition:width .5s ease}
.mrz{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;line-height:1.7;background:rgba(255,255,255,.6);
  border-top:1px dashed var(--line);padding:8px 14px;white-space:nowrap;overflow-x:auto}

.tabs{display:flex;gap:2px;margin:14px 0 10px;overflow-x:auto;border-bottom:1px solid var(--line)}
.tabs button{background:transparent;border:0;padding:9px 11px;font-family:var(--display);font-size:11.5px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--stamp)}

.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;align-items:center}
#search{flex:1 1 150px;min-width:130px;background:var(--paper3);border:1px solid var(--line);border-radius:2px;padding:8px 10px;font-size:14px}
#search:focus{outline:2px solid var(--stamp);outline-offset:1px}
.chip{background:transparent;border:1px solid var(--line);border-radius:20px;padding:5px 10px;font-size:11.5px;color:var(--ink-soft)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper2)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.grid.liste{grid-template-columns:1fr;gap:5px}
.card{position:relative;text-align:left;background:var(--paper3);border:1px solid var(--line);border-radius:2px;
  padding:10px 10px 9px;min-height:92px;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between}
.card.un{background:transparent;border-style:dashed}
.card .mot{font-size:20px;line-height:1}
.card .nm{font-family:var(--display);font-size:13.5px;letter-spacing:.03em;margin-top:5px;padding-right:30px}
.card .sci{font-size:10.5px;font-style:italic;color:var(--ink-soft);margin-top:2px}
.card .meta{font-family:var(--mono);font-size:9px;letter-spacing:.09em;color:var(--ink-soft);text-transform:uppercase;margin-top:5px}
.card .mini{position:absolute;right:-6px;top:6px;transform:rotate(-12deg);border:1.5px solid var(--stamp);border-radius:3px;
  color:var(--stamp);font-family:var(--mono);font-size:12px;padding:2px 6px;opacity:.9;filter:url(#inkfx)}
.tier3 .nm{color:var(--gold)}
.grid.liste .card{flex-direction:row;align-items:center;gap:11px;min-height:0;padding:11px 12px}
.grid.liste .card>div:first-child{display:flex;align-items:center;gap:11px;flex:1;min-width:0}
.grid.liste .nm{font-family:var(--body);font-size:16px;letter-spacing:0;margin:0;padding:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid.liste .sci,.grid.liste .meta{display:none}
.grid.liste .mini{position:static;transform:rotate(-5deg)}
@keyframes slam{0%{transform:rotate(-12deg) scale(2.6);opacity:0}60%{opacity:1}100%{transform:rotate(-12deg) scale(1);opacity:.9}}
.stamped .mini{animation:slam .32s cubic-bezier(.2,1.5,.4,1) both}

.sheet{position:fixed;inset:0;background:rgba(27,46,36,.62);z-index:40;overflow-y:auto;padding:10px}
.page{max-width:640px;margin:0 auto 30px;background:var(--paper2);border:1px solid var(--line);border-radius:3px;position:relative;overflow:hidden}
.page-hd{display:flex;gap:10px;align-items:flex-start;padding:14px 14px 8px;border-bottom:1px dashed var(--line);position:relative}
.page-hd .mot{font-size:32px;line-height:1}
.page-hd h2{font-family:var(--display);font-size:20px;letter-spacing:.05em;margin:2px 0;font-weight:400;padding-right:30px}
.page-hd .sci{font-style:italic;font-size:13px;color:var(--ink-soft)}
.close{position:absolute;right:8px;top:8px;background:transparent;border:0;font-size:22px;padding:4px 8px;color:var(--ink-soft)}
.sec{padding:12px 14px;border-bottom:1px dashed var(--line)}
.sec h3{font-family:var(--mono);font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-soft);margin:0 0 9px;font-weight:400}
.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:7px 12px}
.facts .k{font-family:var(--mono);font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft)}
.facts .v{font-size:13.5px}
.bigbtn{width:100%;background:var(--ink);color:var(--paper2);border:0;border-radius:2px;padding:11px;
  font-family:var(--display);font-size:12.5px;letter-spacing:.14em;text-transform:uppercase}
.bigbtn.on{background:transparent;color:var(--ink-soft);border:1px dashed var(--line)}
.hint{font-size:11.5px;color:var(--ink-soft);margin-top:7px;line-height:1.4}
.frm{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.frm .lb{font-family:var(--mono);font-size:8.5px;letter-spacing:.13em;color:var(--ink-soft);text-transform:uppercase;display:block;margin-bottom:2px}
.frm input,.frm textarea{width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);padding:4px 0;font-size:14px;border-radius:0}
.frm input:focus,.frm textarea:focus{outline:none;border-bottom:1px solid var(--stamp)}
.frm .wide{grid-column:1/-1}
.frm textarea{resize:vertical;min-height:48px;border:1px solid var(--line);padding:6px;background:var(--paper3)}
.modes{display:flex;flex-wrap:wrap;gap:6px}
.modes button{background:transparent;border:1px solid var(--line);border-radius:20px;padding:6px 10px;font-size:12.5px;color:var(--ink-soft)}
.modes button.on{border-color:var(--ink);background:var(--ink);color:var(--paper2)}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.slot{position:relative;aspect-ratio:1/1;border:1px dashed var(--line);border-radius:2px;background:var(--paper3);
  display:flex;align-items:center;justify-content:center;color:var(--ink-soft);font-size:11px;overflow:hidden;padding:0}
.slot img{width:100%;height:100%;object-fit:cover}
.slot .rm{position:absolute;right:3px;top:3px;background:rgba(243,240,231,.9);border:1px solid var(--line);border-radius:2px;font-size:11px;padding:2px 5px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.tag{border:1px solid var(--line);border-radius:20px;padding:3px 9px;font-size:11px;color:var(--ink-soft)}

.ach{width:100%;text-align:left;display:flex;gap:11px;align-items:flex-start;padding:11px 12px;border:1px solid var(--line);
  border-radius:2px;background:var(--paper3);margin-bottom:7px}
.ach.locked{border-style:dashed;background:transparent}
.ach .ic{font-size:20px;filter:grayscale(1)}
.ach:not(.locked) .ic{filter:none}
.ach .t{font-family:var(--display);font-size:13.5px;letter-spacing:.05em}
.ach .d{font-size:12px;color:var(--ink-soft);margin-top:2px}
.ach .pg{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:var(--ink-soft);margin-top:4px}
.ach .chev{color:var(--ink-soft);font-size:18px;align-self:center;opacity:.6}
.pips{display:flex;gap:4px;margin-top:6px}
.pip{width:16px;height:4px;border-radius:2px;background:rgba(27,46,36,.15)}
.pip.on{background:var(--stamp)}
.setgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:5px}
.setitem{display:flex;gap:7px;align-items:center;font-size:13px;color:var(--ink-soft);padding:3px 0;min-width:0}
.setitem span:last-of-type{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.setitem b{font-family:var(--mono);opacity:.5}
.setitem.on{color:var(--ink)}
.setitem.on b{color:var(--stamp);opacity:1}

.eintrag{display:flex;gap:11px;align-items:center;background:var(--paper3);border:1px solid var(--line);
  border-radius:2px;padding:10px 12px;margin-bottom:6px;width:100%;text-align:left}
.eintrag .mot{font-size:20px}
.eintrag .nm{font-size:15px}
.eintrag .sub{font-size:11.5px;color:var(--ink-soft);margin-top:2px}
.eintrag .dt{font-family:var(--mono);font-size:10px;color:var(--ink-soft);margin-left:auto;text-align:right;flex:0 0 auto}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:8px;margin-bottom:14px}
.stat{background:var(--paper3);border:1px solid var(--line);border-radius:2px;padding:9px 10px}
.stat .n{font-family:var(--display);font-size:20px;line-height:1.1}
.stat .l{font-family:var(--mono);font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);margin-top:3px}
.panel{background:var(--paper3);border:1px solid var(--line);border-radius:2px;padding:12px 13px;margin-bottom:10px}
.panel h3{font-family:var(--mono);font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-soft);margin:0 0 9px;font-weight:400}
.xprow{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:4px 0;border-bottom:1px dotted rgba(198,190,171,.8)}
.xprow:last-child{border-bottom:0}
.xprow b{font-family:var(--mono);font-size:12.5px;font-weight:400}
.xprow.sum{border-top:1px solid var(--line);margin-top:5px;padding-top:7px;border-bottom:0}
.flairs{display:flex;flex-wrap:wrap;gap:6px}
.flairs button{background:transparent;border:1px solid var(--line);border-radius:20px;padding:6px 11px;font-family:var(--display);font-size:12px;color:var(--ink-soft)}
.flairs button.on{border-color:var(--stamp);color:var(--stamp)}
.note{font-size:12.5px;color:var(--ink-soft);line-height:1.5}
.empty{font-size:13.5px;color:var(--ink-soft);padding:16px;border:1px dashed var(--line);border-radius:2px;text-align:center}
.rowbtns{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 16px}
.smallbtn{background:transparent;border:1px solid var(--line);border-radius:2px;padding:7px 11px;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink)}
.danger{border-color:var(--stamp-red);color:var(--stamp-red)}
.warn{background:#F7E9C9;border:1px solid var(--gold);padding:9px 11px;border-radius:2px;font-size:12.5px;margin-bottom:12px}
.ordenpop{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;background:rgba(27,46,36,.45);padding:20px}
.ordenkarte{background:var(--paper2);border:2.5px solid var(--stamp);border-radius:4px;padding:20px 24px;text-align:center;max-width:300px;
  position:relative;animation:slamIn .38s cubic-bezier(.2,1.4,.4,1) both}
.ordenkarte::after{content:"";position:absolute;inset:5px;border:1px solid var(--stamp);opacity:.45;border-radius:2px}
.ordenkarte .oben{font-family:var(--mono);font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--stamp)}
.ordenkarte .ic{font-size:38px;margin:9px 0 6px}
.ordenkarte .tt{font-family:var(--display);font-size:18px;letter-spacing:.05em}
.ordenkarte .dd{font-size:12.5px;color:var(--ink-soft);margin-top:5px}
.ordenkarte .fl{font-family:var(--mono);font-size:10px;color:var(--stamp);margin-top:9px}
.ordenkarte .rest{font-family:var(--mono);font-size:9px;color:var(--ink-soft);margin-top:8px}
@keyframes slamIn{0%{transform:scale(2.2) rotate(-8deg);opacity:0}55%{opacity:1}100%{transform:scale(1) rotate(-1.5deg);opacity:1}}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--paper2);
  padding:9px 15px;border-radius:2px;font-size:13px;z-index:80;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90vw;text-align:center}
.toast.on{opacity:1}
@media (max-width:420px){.facts{grid-template-columns:1fr}.grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
:focus-visible{outline:2px solid var(--stamp);outline-offset:2px}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="inkfx"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.1" xChannelSelector="R" yChannelSelector="G"/></filter></svg>
<div class="wrap">
  <header class="pass">
    <div class="pass-head">
      <div><div class="pass-title">Feldbuch</div><div class="pass-sub">Verzeichnis beobachteter Arten</div></div>
      <div class="crest">🔭</div>
    </div>
    <div class="pass-grid">
      <div class="fld"><span class="lb">Beobachter:in</span><input id="nameIn" placeholder="DEIN NAME" autocomplete="off" spellcheck="false"><div class="sub" id="flairOut" style="font-family:var(--display);font-size:12.5px;color:var(--stamp)"></div></div>
      <div class="fld"><span class="lb">Stufe</span><div class="vl" id="lvlOut">1</div></div>
      <div class="fld"><span class="lb">Arten</span><div class="vl" id="cntOut">0<small>/0</small></div></div>
    </div>
    <div class="xpbar"><i id="xpFill" style="width:0%"></i></div>
    <div class="mrz"><div id="mrz1"></div><div id="mrz2"></div></div>
  </header>
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="dex" aria-selected="true">Dex</button>
    <button role="tab" data-tab="log" aria-selected="false">Fundliste</button>
    <button role="tab" data-tab="ach" aria-selected="false">Orden</button>
    <button role="tab" data-tab="prof" aria-selected="false">Profil</button>
    <button role="tab" data-tab="data" aria-selected="false">Daten</button>
  </nav>
  <main>
    <section id="tab-dex">
      <div class="filters">
        <input id="search" placeholder="Art suchen…" autocomplete="off">
        <button class="chip" id="viewToggle">Liste</button>
      </div>
      <div class="filters">
        <button class="chip" data-f="all" aria-pressed="true">Alle</button>
        <button class="chip" data-f="seen" aria-pressed="false">Gesehen</button>
        <button class="chip" data-f="open" aria-pressed="false">Offen</button>
      </div>
      <div class="filters" id="habFilters"></div>
      <div class="filters" id="sortFilters"></div>
      <div class="rowbtns" style="margin:0 0 10px"><button class="smallbtn" id="addArt">+ Eigene Art</button></div>
      <div class="grid" id="grid"></div>
    </section>
    <section id="tab-log" hidden><div class="stats" id="logStats"></div><div id="log"></div></section>
    <section id="tab-ach" hidden>
      <div class="filters" id="achFilters"></div>
      <div class="filters" id="achKat"></div>
      <div id="achList"></div>
    </section>
    <section id="tab-prof" hidden><div id="profBody"></div></section>
    <section id="tab-data" hidden>
      <div id="storeWarn"></div>
      <p class="note">Alles bleibt lokal auf diesem Gerät. Für Backups und Gerätewechsel: exportieren.</p>
      <div class="rowbtns">
        <button class="smallbtn" id="expBtn">Export ohne Fotos</button>
        <button class="smallbtn" id="expFotoBtn">Export mit Fotos</button>
        <button class="smallbtn" id="impBtn">Daten importieren</button>
        <button class="smallbtn danger" id="resetBtn">Alles löschen</button>
      </div>
      <input type="file" id="impFile" accept="application/json" hidden>
      <div class="stats" id="dataStats"></div>
    </section>
  </main>
</div>
<div class="toast" id="toast"></div>
<div id="sheetHost"></div>

/* ====== Fotospeicher (IndexedDB) ====== */
const FDB={name:"feldbuch-fotos",store:"fotos"};
let FOTOS={}, fotoOk=true;
function idb(){return new Promise((res,rej)=>{
  try{const r=indexedDB.open(FDB.name,1);
    r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(FDB.store))r.result.createObjectStore(FDB.store);};
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
  }catch(e){rej(e);}});}
async function fotosLaden(){
  try{const db=await idb();
    await new Promise(res=>{
      const st=db.transaction(FDB.store,"readonly").objectStore(FDB.store), q=st.openCursor();
      FOTOS={};
      q.onsuccess=e=>{const c=e.target.result; if(c){FOTOS[c.key]=c.value||[];c.continue();}else res();};
      q.onerror=()=>res();});
  }catch(e){fotoOk=false;}
}
async function fotosSchreiben(id){
  if(!fotoOk)return;
  try{const db=await idb();
    const st=db.transaction(FDB.store,"readwrite").objectStore(FDB.store);
    const arr=FOTOS[id]||[]; arr.length?st.put(arr,id):st.delete(id);
  }catch(e){fotoOk=false;toast("Fotos konnten nicht gespeichert werden.");}
}
const fotos=id=>FOTOS[id]||[];
async function fotosUmziehen(){
  let n=0;
  Object.entries(state.d||{}).forEach(([k,r])=>{
    if(r.photos&&r.photos.length){FOTOS[k]=(FOTOS[k]||[]).concat(r.photos);r.photos=[];n++;}
  });
  if(n){for(const k of Object.keys(FOTOS))await fotosSchreiben(k); save();
    toast(n+" Einträge mit Fotos in den großen Speicher verschoben.");}
}

/* ====== Speicher ====== */
const KEY="feldbuch.v1";
let memOnly=false, state={name:"",flair:"",view:"kachel",sort:"name",fs:1,custom:[],d:{}};
function load(){try{const r=localStorage.getItem(KEY);if(r)state=Object.assign(state,JSON.parse(r));}catch(e){memOnly=true;}}
function save(){if(memOnly)return;try{localStorage.setItem(KEY,JSON.stringify(state));}
  catch(e){memOnly=true;toast("Speicher voll. Exportiere deine Daten und entferne ein paar Fotos.");}}
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("on");
  clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("on"),2800);}

function achs(){
  const out=[];
  ADEF.forEach(def=>{
    const cur=def.f?def.f():setOf(def).filter(i=>rec(i)&&rec(i).v).length;
    def.tiers.forEach((tt,i)=>out.push({key:def.id+"-"+i,grp:def.id,cat:def.cat,ic:def.ic,
      t:tt.t,fl:tt.fl,d:def.d(tt.n),raw:cur,cur:Math.min(cur,tt.n),need:tt.n,ok:cur>=tt.n}));
  });
  return out;
}
function gruppen(){
  const a=achs();
  return ADEF.map(def=>{
    const slots=a.filter(z=>z.grp===def.id), erreicht=slots.filter(z=>z.ok).length;
    return {def,slots,erreicht,naechst:slots.find(z=>!z.ok)||null,fertig:erreicht===slots.length};
  });
}
function flairs(){return achs().filter(a=>a.fl).map(a=>({name:a.fl,ok:a.ok,von:a.t}));}

function shrink(file,max,q,cb){
  const fr=new FileReader();
  fr.onload=e=>{const img=new Image();
    img.onload=()=>{const s=Math.min(1,max/Math.max(img.width,img.height));
      const cv=document.createElement("canvas");cv.width=Math.round(img.width*s);cv.height=Math.round(img.height*s);
      cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);cb(cv.toDataURL("image/jpeg",q));};
    img.onerror=()=>toast("Bild konnte nicht gelesen werden.");img.src=e.target.result;};
  fr.readAsDataURL(file);
}
function pickPhotos(multi,max,q,done){
  const f=document.createElement("input");f.type="file";f.accept="image/*";if(multi)f.multiple=true;
  f.onchange=()=>{const files=[...f.files];if(!files.length)return;let left=files.length,out=[];
    files.forEach(file=>shrink(file,max,q,u=>{out.push(u);if(!--left)done(out);}));};
  f.click();
}
function bindSheet(){
  const sh=document.getElementById("sheet"); if(!sh)return;
  sh.addEventListener("click",e=>{
    if(e.target===sh){closeSheet();return;}
    const b=e.target.closest("button"); if(!b)return;
    const r=ensure(openId);
    const vor=ordenStand(); setTimeout(()=>ordenPruefen(vor),0);
    if(b.dataset.act==="close"){closeSheet();return;}
    if(b.dataset.act==="delart"){
      if(!confirm("„"+byId(openId).n+"“ mit allen Einträgen löschen?"))return;
      state.custom=(state.custom||[]).filter(z=>z.id!==openId); delete state.d[openId]; save();
      document.getElementById("sheetHost").innerHTML="";document.body.style.overflow="";openId=null;render();toast("Eintrag gelöscht.");return;}
    if(b.dataset.hab){
      const o=(state.custom||[]).find(z=>z.id===openId); if(!o)return;
      o.h=o.h||[]; const i=o.h.indexOf(b.dataset.hab); i>-1?o.h.splice(i,1):o.h.push(b.dataset.hab);
      save();openSheet(openId);return;}
    if(b.dataset.act==="toggle"){
      r.v=r.v?0:1;
      if(r.v){if(!r.first)r.first=new Date().toISOString().slice(0,10);
              if(!r.meth.length)r.meth=["Sichtung"];justStamped=openId;}
      save();openSheet(openId);renderKopf();return;}
    if(b.dataset.meth){const m=b.dataset.meth,i=r.meth.indexOf(m);
      i>-1?r.meth.splice(i,1):r.meth.push(m);save();openSheet(openId);renderKopf();return;}
    if(b.dataset.rm!==undefined){
      (FOTOS[openId]||[]).splice(+b.dataset.rm,1); fotosSchreiben(openId); openSheet(openId); return;}
    if(b.dataset.add!==undefined){pickPhotos(true,700,.5,u=>{
        FOTOS[openId]=FOTOS[openId]||[];
        const frei=MAXFOTOS-FOTOS[openId].length;
        if(u.length>frei)toast("Nur "+frei+" Bild(er) passen noch rein.");
        FOTOS[openId].push(...u.slice(0,frei)); fotosSchreiben(openId); openSheet(openId);});return;}
  });
  const onEdit=e=>{
    const vor=ordenStand(); setTimeout(()=>ordenPruefen(vor),0);
    const ck=e.target.dataset.c;
    if(ck){const o=(state.custom||[]).find(z=>z.id===openId); if(!o)return;
      o[ck]=ck==="t"?+e.target.value:(e.target.value.trim()||(ck==="m"?"🐾":o[ck]||""));save();return;}
    const k=e.target.dataset.k; if(!k)return;
    ensure(openId)[k]=e.target.value; save(); renderKopf();
  };
  sh.addEventListener("change",onEdit); sh.addEventListener("input",onEdit);
}
function openAchSheet(id){
  const x=gruppen().find(z=>z.def.id===id); if(!x)return; const def=x.def;
  const stufen=x.slots.map(z=>`<div class="setitem${z.ok?" on":""}" style="gap:9px">
    <b>${z.ok?"✓":"·"}</b><span style="flex:1">${z.t} — ${z.d}${z.fl?" · Flair „"+z.fl+"“":""}</span>
    <span style="font-family:var(--mono);font-size:10px">${Math.min(z.raw,z.need)}/${z.need}</span></div>`).join("");
  let liste="";
  if(!def.f){
    const arten=setOf(def).map(byId).sort((a,b)=>{const av=rec(a.id)&&rec(a.id).v?0:1,bv=rec(b.id)&&rec(b.id).v?0:1;
      return av-bv||a.n.localeCompare(b.n,"de")});
    liste=`<div class="sec"><h3>Arten · ${arten.filter(z=>rec(z.id)&&rec(z.id).v).length}/${arten.length}</h3>
      <div class="setgrid">${arten.map(z=>{const on=rec(z.id)&&rec(z.id).v;
        return `<div class="setitem${on?" on":""}"><span>${z.m}</span><span>${z.n}</span><b>${on?"✓":"·"}</b></div>`}).join("")}</div></div>`;
  }
  document.getElementById("sheetHost").innerHTML=`<div class="sheet" id="sheet"><div class="page">
    <div class="page-hd"><div class="mot">${def.ic}</div>
      <div><h2>${def.name}</h2><div class="sci" style="font-style:normal;font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase">${def.cat} · ${x.erreicht}/${x.slots.length} Stufen</div></div>
      <button class="close" data-act="close">✕</button></div>
    <div class="sec"><h3>Stufen</h3>${stufen}</div>${liste}
    <div class="sec" style="border:0;text-align:right"><button class="smallbtn" data-act="close">Schließen</button></div>
  </div></div>`;
  document.body.style.overflow="hidden";
  document.getElementById("sheet").addEventListener("click",e=>{
    if(e.target.id==="sheet"||e.target.closest('[data-act="close"]')){
      document.getElementById("sheetHost").innerHTML="";document.body.style.overflow="";}});
}

/* ====== Events ====== */
document.querySelectorAll(".tabs button").forEach(b=>b.addEventListener("click",()=>{
  tab=b.dataset.tab;
  document.querySelectorAll(".tabs button").forEach(z=>z.setAttribute("aria-selected",z===b));
  ["dex","log","ach","prof","data"].forEach(t=>document.getElementById("tab-"+t).hidden=(t!==tab));
  render();window.scrollTo(0,0);}));
document.getElementById("grid").addEventListener("click",e=>{const c=e.target.closest(".card");if(c)openSheet(c.dataset.id);});
document.getElementById("log").addEventListener("click",e=>{const c=e.target.closest(".eintrag");if(c)openSheet(c.dataset.id);});
document.getElementById("achList").addEventListener("click",e=>{const b=e.target.closest("[data-grp]");if(b)openAchSheet(b.dataset.grp);});
document.getElementById("achFilters").addEventListener("click",e=>{const b=e.target.closest("[data-af]");if(!b)return;
  aFilter=b.dataset.af;document.querySelectorAll("#achFilters [data-af]").forEach(z=>z.setAttribute("aria-pressed",z===b));renderAch();});
document.getElementById("achKat").addEventListener("click",e=>{const b=e.target.closest("[data-ak]");if(!b)return;
  aKat=b.dataset.ak;document.querySelectorAll("#achKat [data-ak]").forEach(z=>z.setAttribute("aria-pressed",z===b));renderAch();});
document.getElementById("habFilters").addEventListener("click",e=>{const b=e.target.closest("[data-h]");if(!b)return;
  hFilter=b.dataset.h;document.querySelectorAll("#habFilters [data-h]").forEach(z=>z.setAttribute("aria-pressed",z===b));renderDex();});
document.querySelectorAll('.filters [data-f]').forEach(b=>b.addEventListener("click",()=>{
  filter=b.dataset.f;document.querySelectorAll('.filters [data-f]').forEach(z=>z.setAttribute("aria-pressed",z===b));renderDex();}));
document.getElementById("sortFilters").addEventListener("click",e=>{
  const b=e.target.closest("[data-s]"); if(!b)return; state.sort=b.dataset.s; save();
  document.querySelectorAll("#sortFilters [data-s]").forEach(z=>z.setAttribute("aria-pressed",z===b)); renderDex();});
document.getElementById("addArt").addEventListener("click",()=>{
  const n=(prompt("Name der Art?")||"").trim(); if(!n)return;
  const base="x"+n.toLowerCase().replace(/[^a-zäöüß]/g,"").slice(0,10);
  let id=base,i=1; while(byId(id)){id=base+i;i++;}
  state.custom=state.custom||[];
  state.custom.push({id,n,s:"",o:"",fa:"",h:[],t:1,m:"🐾",r:[],tip:"",eigen:1});
  save(); renderDex(); openSheet(id);});
document.getElementById("viewToggle").addEventListener("click",()=>{
  state.view=state.view==="liste"?"kachel":"liste";save();renderDex();});
document.getElementById("search").addEventListener("input",e=>{q=e.target.value.trim().toLowerCase();renderDex();});
document.getElementById("nameIn").addEventListener("input",e=>{state.name=e.target.value;save();renderKopf();});
document.getElementById("profBody").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.flair!==undefined){state.flair=b.dataset.flair;save();renderProf();renderKopf();return;}
  if(b.dataset.fs){state.fs=+b.dataset.fs;save();schrift();renderProf();return;}});
function exportieren(mitFotos){
  const daten=mitFotos?Object.assign({},state,{fotos:FOTOS}):state;
  const b=new Blob([JSON.stringify(daten)],{type:"application/json"}),a=document.createElement("a");
  a.href=URL.createObjectURL(b);
  a.download="feldbuch"+(mitFotos?"-mit-fotos":"")+"-"+new Date().toISOString().slice(0,10)+".json";
  a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),8000);
}
document.getElementById("expBtn").addEventListener("click",()=>exportieren(false));
document.getElementById("expFotoBtn").addEventListener("click",()=>exportieren(true));
document.getElementById("impBtn").addEventListener("click",()=>document.getElementById("impFile").click());
document.getElementById("impFile").addEventListener("change",e=>{
  const f=e.target.files[0];if(!f)return;const fr=new FileReader();
  fr.onload=async()=>{try{const o=JSON.parse(fr.result);if(!o||typeof o!=="object"||!o.d)throw 0;
    const mit=o.fotos&&typeof o.fotos==="object"; const bilder=mit?o.fotos:null; delete o.fotos;
    state=Object.assign({name:"",flair:"",view:"kachel",sort:"name",fs:1,custom:[],d:{}},o);save();
    if(bilder){FOTOS=bilder; for(const k of Object.keys(FOTOS))await fotosSchreiben(k);}
    await fotosUmziehen();
    document.getElementById("nameIn").value=state.name||"";schrift();render();
    toast(mit?"Daten samt Fotos geladen.":"Daten geladen (ohne Fotos).");}
    catch(err){toast("Datei passt nicht. Bitte eine Export-Datei wählen.");}};
  fr.readAsText(f);e.target.value="";});
document.getElementById("resetBtn").addEventListener("click",()=>{
  if(!confirm("Alle Einträge, Notizen und Fotos löschen? Das lässt sich nicht rückgängig machen."))return;
  const keys=Object.keys(FOTOS); FOTOS={}; keys.forEach(k=>fotosSchreiben(k));
  state={name:"",flair:"",view:"kachel",sort:"name",fs:1,custom:[],d:{}};save();document.getElementById("nameIn").value="";render();toast("Alles gelöscht.");});
document.addEventListener("keydown",e=>{if(e.key!=="Escape")return;
  if(openId){closeSheet();return;}
  if(document.getElementById("sheet")){document.getElementById("sheetHost").innerHTML="";document.body.style.overflow="";}});
function schrift(){const f=+state.fs||1;document.body.style.zoom=f===1?"":f;
  if(document.body.style.zoom==="")document.body.style.fontSize=f===1?"":(f*100)+"%";}

/* ====== Start ====== */
if("serviceWorker" in navigator && location.protocol==="https:")
  window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
load();
try{localStorage.setItem(KEY+".t","1");localStorage.removeItem(KEY+".t");}catch(e){memOnly=true;}
document.getElementById("nameIn").value=state.name||"";
schrift(); render();
(async()=>{ await fotosLaden(); await fotosUmziehen(); render(); })();
